<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MyMicroAI Chat</title>
<style>
:root{color-scheme:dark;--bg:#0A0A0C;--card:#050506;--field:#030304;--line:#1F1F24;--line2:#2A2A31;--text:#FFFFFF;--muted:#7E7E8F;--accent:#FF5A00;--bad:#ff6b4a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif}
body{display:flex;justify-content:center}
.app{display:flex;flex-direction:column;width:min(860px,100%);height:100%;padding:16px}
header{display:flex;align-items:center;gap:12px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.mark{width:34px;height:34px;border:1px solid var(--line2);border-radius:10px;display:grid;place-items:center;color:var(--accent);font-weight:900;flex:none}
.titles{flex:1;min-width:0}
.kicker{margin:0;color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}
.chat-title{margin:2px 0 0;font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.state{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:13px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line2)}
.dot.on{background:var(--accent)}
button{height:38px;padding:0 14px;border:0;border-radius:10px;background:var(--accent);color:#090909;font:inherit;font-weight:800;cursor:pointer}
button.ghost{background:#080809;color:var(--text);border:1px solid var(--line)}
button:disabled{opacity:.5;cursor:not-allowed}
.banner{margin:12px 0 0;padding:12px 14px;border:1px solid var(--line);border-radius:12px;color:var(--muted);line-height:1.5;font-size:14px}
.banner.err{border-color:var(--bad);color:var(--bad)}
.banner[hidden]{display:none}
#messages{flex:1;overflow-y:auto;padding:18px 2px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:82%;padding:10px 13px;border-radius:14px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word;font-size:15px}
.msg.user{align-self:flex-end;background:#1a0e06;border:1px solid #4a2410}
.msg.assistant{align-self:flex-start;background:var(--card);border:1px solid var(--line)}
.msg.pending{opacity:.55}
.who{display:block;margin-bottom:3px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.msg.user .who{color:var(--accent)}
.empty{margin:auto;color:var(--muted);text-align:center;line-height:1.6}
.thinking{align-self:flex-start;color:var(--muted);font-size:14px}
.composer{display:flex;gap:10px;padding-top:12px;border-top:1px solid var(--line)}
textarea{flex:1;min-height:46px;max-height:180px;resize:none;border:1px solid var(--line);border-radius:10px;background:var(--field);color:var(--text);padding:12px 13px;font:inherit;outline:none}
textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,90,0,.13)}
.composer button{height:46px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px;color:var(--muted);font-size:12px}
details{margin-top:8px;color:var(--muted);font-size:12px}
summary{cursor:pointer}
#log{margin:8px 0 0;max-height:160px;overflow:auto;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--field);font:12px/1.45 ui-monospace,Consolas,monospace;white-space:pre-wrap}
@media(max-width:560px){.app{padding:10px}.state span:last-child{display:none}.msg{max-width:92%}}
</style>
</head>
<body>
<main class="app">
  <header>
    <div class="mark">M</div>
    <div class="titles">
      <p class="kicker">MyMicroAI · USB</p>
      <p class="chat-title" id="chatTitle">Не подключено</p>
    </div>
    <div class="state"><span class="dot" id="dot"></span><span id="stateText">offline</span></div>
    <button class="ghost" id="newChatBtn" disabled>Новый чат</button>
    <button id="connectBtn">Подключить</button>
  </header>
  <p class="banner" id="banner" hidden></p>
  <section id="messages"><p class="empty" id="empty">Подключите MyMicroAI по USB и нажмите «Подключить».<br>Порт выбирается один раз — дальше страница подключается сама.</p></section>
  <div class="composer">
    <textarea id="input" placeholder="Сообщение… (Enter — отправить, Shift+Enter — новая строка)" disabled></textarea>
    <button id="sendBtn" disabled>Отправить</button>
  </div>
  <div class="foot"><span id="counter"></span><span>Chrome / Edge · Web Serial</span></div>
  <details><summary>Лог устройства</summary><pre id="log"></pre></details>
</main>
<script>
const PREFIX = '@mma ';
const MAX_BYTES = 2500;        // device keeps up to 2560 bytes per message
const BAUD = 115200;
const $ = id => document.getElementById(id);
const encoder = new TextEncoder();

let port = null, reader = null, writer = null;
let deviceState = 'offline', helloTimer = null, busy = false, pendingEl = null, thinkingEl = null, inHistory = false;

function setBanner(text, isError) {
  const el = $('banner');
  el.hidden = !text;
  el.textContent = text || '';
  el.className = 'banner' + (isError ? ' err' : '');
}

function setState(state) {
  deviceState = state;
  const labels = {offline:'offline', waiting:'ждём устройство', work:'online', setup:'режим настройки', error:'ошибка', boot:'загрузка'};
  $('stateText').textContent = labels[state] || state;
  $('dot').classList.toggle('on', state === 'work');
  const ready = state === 'work';
  $('input').disabled = !ready;
  $('newChatBtn').disabled = !ready || busy;
  updateSendButton();
  $('connectBtn').hidden = state !== 'offline';
  if (state === 'setup') setBanner('Устройство в режиме настройки. Завершите настройку Wi-Fi и API на самом устройстве.');
  else if (state === 'error') setBanner('Устройство показывает ошибку. Нажмите RETRY или SETUP на экране устройства.', true);
  else if (state === 'waiting') setBanner('Порт открыт, ждём ответа от прошивки… Если плата перезагрузилась, это займёт до 30 секунд.');
  else setBanner('');
}

function updateSendButton() {
  const bytes = encoder.encode($('input').value).length;
  $('counter').textContent = bytes ? `${bytes} / ${MAX_BYTES} байт` : '';
  $('sendBtn').disabled = deviceState !== 'work' || busy || !$('input').value.trim() || bytes > MAX_BYTES;
}

function log(line) {
  const el = $('log');
  el.textContent += line + '\n';
  const lines = el.textContent.split('\n');
  if (lines.length > 300) el.textContent = lines.slice(-300).join('\n');
  el.scrollTop = el.scrollHeight;
}

function scrollDown() { const m = $('messages'); m.scrollTop = m.scrollHeight; }

function clearMessages() {
  $('messages').innerHTML = '';
  pendingEl = null; thinkingEl = null;
}

function addMessage(role, content, extraClass) {
  $('empty')?.remove();
  const el = document.createElement('div');
  el.className = 'msg ' + (role === 'user' ? 'user' : 'assistant') + (extraClass ? ' ' + extraClass : '');
  const who = document.createElement('span');
  who.className = 'who';
  who.textContent = role === 'user' ? 'Вы' : 'AI';
  el.append(who, document.createTextNode(content));
  $('messages').append(el);
  scrollDown();
  return el;
}

function setBusy(on) {
  busy = on;
  if (on && !thinkingEl) {
    thinkingEl = document.createElement('p');
    thinkingEl.className = 'thinking';
    thinkingEl.textContent = 'AI думает…';
    $('messages').append(thinkingEl);
    scrollDown();
  }
  if (!on && thinkingEl) { thinkingEl.remove(); thinkingEl = null; }
  $('newChatBtn').disabled = deviceState !== 'work' || on;
  updateSendButton();
}

async function sendCommand(obj) {
  if (!writer) return;
  await writer.write(encoder.encode(JSON.stringify(obj) + '\n'));
}

function handleEvent(evt) {
  switch (evt.type) {
    case 'hello': {
      clearInterval(helloTimer); helloTimer = null;
      const wasWorking = deviceState === 'work';
      setState(evt.state);
      if (evt.state === 'work' && !wasWorking) {
        $('chatTitle').textContent = evt.chat || 'Чат';
        sendCommand({cmd: 'history'});
      }
      break;
    }
    case 'history_begin':
      inHistory = true;
      clearMessages();
      $('chatTitle').textContent = evt.chat || 'Чат';
      break;
    case 'history_end':
      inHistory = false;
      if (!$('messages').querySelector('.msg')) {
        $('messages').innerHTML = '<p class="empty" id="empty">Новый чат. Напишите что-нибудь — ответ появится и здесь, и на экране устройства.</p>';
      }
      break;
    case 'message':
      if (!inHistory && evt.role === 'user' && pendingEl) { pendingEl.remove(); pendingEl = null; }
      if (thinkingEl) thinkingEl.remove();
      addMessage(evt.role, evt.content);
      if (thinkingEl) { $('messages').append(thinkingEl); scrollDown(); }
      if (evt.role === 'assistant') setBusy(false);
      break;
    case 'status':
      if (evt.text === 'thinking') setBusy(true);
      break;
    case 'error':
      setBusy(false);
      if (pendingEl) {
        // Same as on the device: the failed text goes back into the input.
        if (!$('input').value) $('input').value = pendingEl.lastChild.textContent;
        pendingEl.remove(); pendingEl = null;
        updateSendButton();
      }
      setBanner('Ошибка: ' + evt.text, true);
      break;
  }
}

function handleLine(line) {
  if (!line.startsWith(PREFIX)) { if (line.trim()) log(line); return; }
  try { handleEvent(JSON.parse(line.slice(PREFIX.length))); }
  catch (e) { log('[bad protocol line] ' + line); }
}

async function readLoop() {
  const decoder = new TextDecoderStream();
  const closed = port.readable.pipeTo(decoder.writable).catch(() => {});
  reader = decoder.readable.getReader();
  let buffer = '';
  try {
    while (true) {
      const {value, done} = await reader.read();
      if (done) break;
      buffer += value;
      let index;
      while ((index = buffer.indexOf('\n')) >= 0) {
        handleLine(buffer.slice(0, index).replace(/\r$/, ''));
        buffer = buffer.slice(index + 1);
      }
    }
  } catch (e) {
    log('[read stopped] ' + e.message);
  } finally {
    reader.releaseLock();
    await closed;
  }
}

async function openPort(selected) {
  if (port) return;
  port = selected;
  try {
    await port.open({baudRate: BAUD, bufferSize: 65536});
    // Keep DTR/RTS low: on many ESP32 boards toggling them resets the chip.
    await port.setSignals({dataTerminalReady: false, requestToSend: false}).catch(() => {});
  } catch (e) {
    port = null;
    setBanner('Не удалось открыть порт: ' + e.message + '. Закройте монитор порта PlatformIO/Arduino и попробуйте снова.', true);
    return;
  }
  writer = port.writable.getWriter();
  setState('waiting');
  sendCommand({cmd: 'hello'});
  helloTimer = setInterval(() => sendCommand({cmd: 'hello'}), 1500);
  await readLoop();
  await closePort();
}

async function closePort() {
  clearInterval(helloTimer); helloTimer = null;
  try { writer?.releaseLock(); } catch (e) {}
  try { await port?.close(); } catch (e) {}
  writer = null; reader = null; port = null;
  setBusy(false);
  setState('offline');
  $('chatTitle').textContent = 'Не подключено';
  setBanner('Устройство отключено. Подключите его снова — страница переподключится сама.');
}

async function sendMessage() {
  const text = $('input').value.trim();
  if (!text || busy || deviceState !== 'work') return;
  if (encoder.encode(text).length > MAX_BYTES) return;
  setBanner('');
  $('input').value = '';
  updateSendButton();
  pendingEl = addMessage('user', text, 'pending');
  setBusy(true);
  await sendCommand({cmd: 'send', text});
}

$('connectBtn').addEventListener('click', async () => {
  try { await openPort(await navigator.serial.requestPort()); }
  catch (e) { if (e.name !== 'NotFoundError') setBanner(e.message, true); }
});
$('newChatBtn').addEventListener('click', () => sendCommand({cmd: 'new_chat'}));
$('sendBtn').addEventListener('click', sendMessage);
$('input').addEventListener('input', updateSendButton);
$('input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

if (!('serial' in navigator)) {
  $('connectBtn').disabled = true;
  setBanner('Этот браузер не поддерживает Web Serial. Откройте страницу в Google Chrome или Microsoft Edge.', true);
} else {
  setState('offline');
  // Ports picked before are remembered by the browser: reconnect on plug-in.
  navigator.serial.addEventListener('connect', e => openPort(e.target));
  navigator.serial.getPorts().then(ports => { if (ports.length) openPort(ports[0]); });
}
</script>
</body>
</html>
